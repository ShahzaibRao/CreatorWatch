<!doctype html>
<html lang="{{ lang }}" data-theme="dark">
<head><link rel="icon" href="/app-icon.png"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Activate — CreatorWatch</title>
<style>
:root{--bg:#0b0f14;--surface:#12181f;--surface2:#0e141b;--border:#212b36;--text:#e8edf2;--muted:#93a0b0;--accent:#12b981;--shadow:0 8px 28px rgba(0,0,0,.35);--r:14px}
[data-theme="light"]{--bg:#eef1f4;--surface:#fff;--surface2:#f6f8fa;--border:#dfe6ec;--text:#101820;--muted:#5d6b7a;--shadow:0 8px 24px rgba(16,24,32,.08)}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,"Noto Sans SC",sans-serif;background:var(--bg);color:var(--text)}
.wrap{max-width:560px;margin:0 auto;padding:22px 16px 60px}
.top{display:flex;justify-content:flex-end;align-items:center;margin-bottom:14px;gap:8px;flex-wrap:wrap}
h1{font-size:19px;margin:0}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);padding:20px;margin-bottom:14px}
label{font-size:13px;font-weight:600;display:block;margin:12px 0 8px}
label:first-of-type{margin-top:0}
input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:16px;text-transform:uppercase;letter-spacing:1px}
button{width:100%;margin-top:14px;border:0;border-radius:10px;padding:12px;font-weight:700;font-size:15px;cursor:pointer;background:var(--accent);color:#04281c}
.msg{padding:11px 14px;border-radius:10px;font-size:13.5px;margin-bottom:14px;background:rgba(229,72,77,.13);color:#e5484d;border:1px solid rgba(229,72,77,.4)}
.tip{font-size:13px;color:var(--muted);line-height:1.7;margin:4px 0}
.tip b{color:var(--text)}
.theme-btn{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:999px;padding:9px 14px;cursor:pointer;font-size:13px;font-weight:600}
select.langsel{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:999px;padding:9px 12px;font-size:13px;font-weight:600}
.topbtns{display:flex;gap:8px;align-items:center;flex-wrap:nowrap}
.logo{text-align:center;font-size:44px;margin:26px 0 6px}
h1{text-align:center}
.center{text-align:center}
</style></head>
<body><div class="wrap">
<div class="top"><div class="topbtns">
<select class="langsel" onchange="window.location.href='/lang/'+this.value">{% for code, name in langs.items() %}<option value="{{ code }}" {% if code==lang %}selected{% endif %}>{{ name }}</option>{% endfor %}</select>
<button class="theme-btn" id="themeBtn">◐</button></div></div>
<div class="logo">🔑</div>
<h1>CreatorWatch Pro</h1>
<p class="tip center">Apni license key dalo. Key website par signup + purchase ke baad milti hai.</p>
{% if msg %}<div class="msg">{{ msg }}</div>{% endif %}
<div class="card">
<form method="post">
<label>License key</label>
<input name="key" placeholder="CW-XXXX-XXXX-XXXX-XXXX" autocomplete="off" autofocus>
<button type="submit">Activate</button>
</form>
<p class="tip">Pehli dafa internet zaroori hai. Us ke baad <b>7 din</b> tak offline bhi chalta rahega.</p>
</div>
</div>
<script>
(function(){var r=document.documentElement,b=document.getElementById('themeBtn');function a(t){r.setAttribute('data-theme',t);try{localStorage.setItem('pd-theme',t)}catch(e){}}var s=null;try{s=localStorage.getItem('pd-theme')}catch(e){}if(!s){s=(window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches)?'light':'dark'}a(s);b.onclick=function(){a(r.getAttribute('data-theme')==='light'?'dark':'light')}})();
</script>
</body></html>
