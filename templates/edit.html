<!doctype html>
<html lang="{{ lang }}" data-theme="dark">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ t('e_title') }} — {{ p.name }}</title>
<style>
:root{--bg:#0b0f14;--surface:#12181f;--surface2:#0e141b;--border:#212b36;--text:#e8edf2;--muted:#93a0b0;--accent:#12b981;--shadow:0 8px 28px rgba(0,0,0,.35);--r:14px}
[data-theme="light"]{--bg:#eef1f4;--surface:#fff;--surface2:#f6f8fa;--border:#dfe6ec;--text:#101820;--muted:#5d6b7a;--shadow:0 8px 24px rgba(16,24,32,.08)}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,"Noto Sans SC",sans-serif;background:var(--bg);color:var(--text)}
.wrap{max-width:560px;margin:0 auto;padding:22px 16px 60px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:8px;flex-wrap:wrap}
h1{font-size:19px;margin:0}
a{color:#3b9eff;text-decoration:none}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);padding:20px}
label{font-size:12px;color:var(--muted);font-weight:600;display:block;margin:12px 0 6px}
label:first-of-type{margin-top:0}
input,select{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:14px}
button{width:100%;margin-top:16px;border:0;border-radius:10px;padding:12px;font-weight:700;font-size:15px;cursor:pointer;background:var(--accent);color:#04281c}
.theme-btn{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:999px;padding:9px 14px;cursor:pointer;font-size:13px;font-weight:600}
select.langsel{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:999px;padding:9px 12px;font-size:13px;font-weight:600}
.topbtns{display:flex;gap:8px;align-items:center;flex-wrap:nowrap}
.topbtns .theme-btn,.topbtns .langsel{white-space:nowrap}
@media(max-width:560px){.topbtns{gap:6px}.topbtns .theme-btn{padding:7px 9px;font-size:11.5px}.topbtns .langsel{max-width:104px;padding:7px 4px;font-size:11.5px}}
</style></head>
<body><div class="wrap">
<div class="top"><a href="/">← {{ t('back_dash') }}</a><div class="topbtns">
<select class="langsel" onchange="window.location.href='/lang/'+this.value">{% for code, name in langs.items() %}<option value="{{ code }}" {% if code==lang %}selected{% endif %}>{{ name }}</option>{% endfor %}</select>
<button class="theme-btn" id="themeBtn">◐</button></div></div>
<h1>{{ t('e_title') }}: {{ p.name }}</h1>
<p style="color:var(--muted);font-size:13px">{{ t('e_sub') }}</p>
<div class="card"><form method="post">
{% if msg %}<p style="color:#f0524f;font-size:13px">{{ msg }}</p>{% endif %}
<label>{{ t('e_name') }}</label><input name="name" value="{{ p.name }}" required>
<label>{{ t('e_link') }}</label><input name="url" value="{{ p.url }}" required>
<label>Save folder</label><div style="display:flex;gap:8px"><input id="editFolder" name="folder" value="{{ p.folder }}" readonly><button type="button" class="btn ghost browse-btn" data-target="editFolder" style="white-space:nowrap;padding:11px 14px">📁 Select</button></div>
<label>{{ t('e_interval') }}</label><input name="interval" type="number" value="{{ p.interval_minutes or 15 }}" min="5" max="1440">
<label>{{ t('e_quality') }}</label>
<select name="quality">
<option value="720p" {% if p.quality=='720p' %}selected{% endif %}>720p</option>
<option value="1080p" {% if p.quality=='1080p' %}selected{% endif %}>1080p</option>
<option value="480p" {% if p.quality=='480p' %}selected{% endif %}>480p</option>
<option value="360p" {% if p.quality=='360p' %}selected{% endif %}>360p</option>
<option value="best" {% if p.quality=='best' %}selected{% endif %}>Best</option>
</select>
<label>Scope (YouTube: videos+shorts / sirf videos / sirf shorts)</label>
<select name="scope">
<option value="both" {% if (p.scope or 'both')=='both' %}selected{% endif %}>Both</option>
<option value="videos" {% if p.scope=='videos' %}selected{% endif %}>Videos only</option>
<option value="shorts" {% if p.scope=='shorts' %}selected{% endif %}>Shorts only</option>
</select>
<button type="submit">{{ t('e_save') }}</button>
</form></div>
</div>
<script>
(function(){var r=document.documentElement,b=document.getElementById('themeBtn');function a(t){r.setAttribute('data-theme',t);try{localStorage.setItem('pd-theme',t)}catch(e){}}var s=null;try{s=localStorage.getItem('pd-theme')}catch(e){}if(!s){s=(window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches)?'light':'dark'}a(s);b.onclick=function(){a(r.getAttribute('data-theme')==='light'?'dark':'light')}})();
(function(){ if(window.pywebview){ document.querySelectorAll('.browse-btn').forEach(function(b){ b.onclick=function(){ window.pywebview.api.pick_folder().then(function(p){ if(p) document.getElementById(b.dataset.target).value=p; }); }; }); } else { document.querySelectorAll('.browse-btn').forEach(function(b){ b.style.display='none'; var inp=document.getElementById(b.dataset.target); if(inp) inp.removeAttribute('readonly'); }); } })();
</script>
</body></html>
