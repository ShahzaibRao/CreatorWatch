name: Build + Release (Windows)

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync VERSION from tag
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -match '^v\d+\.\d+\.\d+$') {
            $ver = $tag.TrimStart('v')
            (Get-Content app.py) -replace '^VERSION = ".*"$', ("VERSION = `"" + $ver + "`"") | Set-Content app.py
            Write-Host "VERSION set to $ver"
          } else {
            Write-Host "No version tag — keeping VERSION from code"
          }

      - name: Install deps
        run: pip install -r requirements.txt pyinstaller

      - name: Build EXE (PyInstaller onedir — stable, no temp-extract)
        run: pyinstaller --noconfirm --onedir --noconsole --name CreatorWatch --add-data "templates;templates" --add-data "vendor;vendor" --collect-all webview --exclude-module yt_dlp --exclude-module gallery_dl --exclude-module imageio_ffmpeg --exclude-module yt_dlp_plugins --exclude-module PIL app.py

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Compile installer
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -match '^v\d+\.\d+\.\d+$') { $ver = $tag.TrimStart('v') } else { $ver = "0.0.0-dev" }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=$ver installer/CreatorWatch.iss
          Get-ChildItem installer/*.exe, dist/*.exe

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/CreatorWatch.exe
            installer/CreatorWatch-Setup-*.exe
          generate_release_notes: true

      - name: Upload dev build (artifacts)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: CreatorWatch-dev-${{ github.sha }}
          retention-days: 14
          path: |
            dist/CreatorWatch.exe
            installer/CreatorWatch-Setup-*.exe
