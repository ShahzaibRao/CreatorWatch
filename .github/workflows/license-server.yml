# License server — Docker image CI.
#
# license-server/ me har tabdeeli par multi-arch image ban kar Docker Hub
# par push hoti hai:  <DOCKERHUB_USERNAME>/creatorwatch-license:latest
# Isi image se ArgoCD deploy hoga, aur koi bhi `docker run` kar sakega.
#
# Required repo secrets (GitHub → Settings → Secrets and variables → Actions):
#   DOCKERHUB_USERNAME   Docker Hub username
#   DOCKERHUB_TOKEN      Docker Hub access token (hub.docker.com → Account
#                        Settings → Security → New Access Token)

name: license-server image

on:
  push:
    branches: [cloud]
    paths:
      - "license-server/**"
      - ".github/workflows/license-server.yml"
    tags:
      - "license-server-v*"
  workflow_dispatch:

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (arm64 build ke liye)
        uses: docker/setup-qemu-action@v3

      - name: Set up buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/creatorwatch-license
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/cloud' }}
            type=sha,prefix=sha-,format=short
            type=match,pattern=license-server-v(.*),group=1

      - name: Build + push (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: ./license-server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
