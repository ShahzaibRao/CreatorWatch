# License server — Docker image CI.
#
# license-server/ me har tabdeeli par multi-arch image ban kar Docker Hub
# par push hoti hai:  <DOCKERHUB_USERNAME>/creatorwatch-license
# Tags: latest (har build) + current app release (e.g. v0.5.4 — rollback
# me seedha version nazar aaye) + license-server-v* manual immutable tags.
# Isi image se ArgoCD deploy hoga, aur koi bhi `docker run` kar sakega.
#
# Required repo secrets (GitHub → Settings → Secrets and variables → Actions):
#   DOCKERHUB_USERNAME   Docker Hub username
#   DOCKERHUB_TOKEN      Docker Hub access token (hub.docker.com → Account
#                        Settings → Security → New Access Token)

name: license-server image

on:
  push:
    branches: [cloud]
    paths:
      - "license-server/**"
      - ".github/workflows/license-server.yml"
    tags:
      - "license-server-v*"
  workflow_dispatch:

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (arm64 build ke liye)
        uses: docker/setup-qemu-action@v3

      - name: Set up buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Latest app release tag (e.g. v0.5.4)
        id: apprel
        run: |
          TAG=$(gh release view --json tagName --jq .tagName 2>/dev/null || true)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Latest app release: $TAG"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/creatorwatch-license
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/cloud' }}
            type=raw,value=${{ steps.apprel.outputs.tag }},enable=${{ steps.apprel.outputs.tag != '' }}
            type=match,pattern=license-server-v(.*),group=1

      - name: Build + push (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: ./license-server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  hub-description:
    # Docker Hub repo page (overview) khud DOCKERHUB.md se sync hoti hai —
    # jese nginx waghera ki hoti hai.
    #
    # NOTE: peter-evans/dockerhub-description use NAHI kiya — wo legacy
    # /v2/repositories/{ns}/{repo}/ route par PATCH karta hai, jo access
    # token se bane JWT ko hamesha "Error: Forbidden" deta hai (token kitna
    # bhi scoped ho). Neeche wala namespace route wahi token qabool karta
    # hai jo image push ke liye use hota hai — koi naya secret nahi chahiye.
    runs-on: ubuntu-latest
    needs: build-push
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fill Docker Hub username
        run: |
          sed "s|<dockerhub-username>|${{ secrets.DOCKERHUB_USERNAME }}|g" \
            license-server/DOCKERHUB.md > /tmp/DOCKERHUB.md

      - name: Sync Docker Hub description
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          SHORT_DESCRIPTION: "Accounts + license-key server for the CreatorWatch desktop app"
          IMAGE: creatorwatch-license
        run: |
          set -euo pipefail
          jwt=$(curl -sS -X POST https://hub.docker.com/v2/auth/token \
            -H 'Content-Type: application/json' \
            -d "$(jq -n --arg u "$DOCKERHUB_USERNAME" --arg p "$DOCKERHUB_TOKEN" \
              '{identifier:$u, secret:$p}')" | jq -r '.access_token // empty')
          if [ -z "$jwt" ]; then
            echo "::error::Could not obtain a Docker Hub token for $DOCKERHUB_USERNAME"
            exit 1
          fi
          payload=$(jq -n --arg d "$SHORT_DESCRIPTION" --rawfile f /tmp/DOCKERHUB.md \
            '{description:$d, full_description:$f}')
          code=$(curl -sS -o /tmp/dh.json -w '%{http_code}' -X PATCH \
            -H "Authorization: Bearer $jwt" \
            -H 'Content-Type: application/json' \
            -d "$payload" \
            "https://hub.docker.com/v2/namespaces/$DOCKERHUB_USERNAME/repositories/$IMAGE")
          echo "HTTP $code"
          cat /tmp/dh.json
          echo
          case "$code" in
            2*) echo "Docker Hub description updated." ;;
            *) echo "::error::Docker Hub refused the description update (HTTP $code)"; exit 1 ;;
          esac
