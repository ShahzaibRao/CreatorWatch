<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}CreatorWatch{% endblock %}</title>
<style>
:root{--bg:#0c1117;--card:#131a24;--card2:#0f1520;--line:#1e2a3a;--txt:#e8edf3;--muted:#8b95a5;--teal:#12b981;--teal-d:#0d8f63;--amber:#f5a524;--red:#f0524f}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,"Segoe UI",Roboto,Inter,Arial,sans-serif;line-height:1.6;min-height:100vh;display:flex;flex-direction:column}
a{color:var(--teal);text-decoration:none}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px;width:100%}
nav{border-bottom:1px solid var(--line);padding:14px 0}
nav .wrap{display:flex;align-items:center;gap:18px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;color:var(--txt)}
.logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#0e2a22,#12b981);display:flex;align-items:center;justify-content:center;flex:none}
.logo svg{width:18px;height:18px;stroke:#fff}
.navlinks{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{display:inline-block;background:var(--teal);color:#04271c;font-weight:700;padding:10px 22px;border-radius:10px;border:0;cursor:pointer;font-size:15px}
.btn:hover{background:var(--teal-d);color:#fff}
.btn.ghost{background:transparent;color:var(--txt);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--teal);color:var(--teal)}
.btn:disabled{opacity:.45;cursor:not-allowed}
main{flex:1;padding:48px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px}
.hero{text-align:center;padding:40px 0 30px}
.hero h1{font-size:clamp(30px,5vw,52px);line-height:1.15;margin:18px 0 12px}
.hero h1 span{color:var(--teal)}
.hero p{color:var(--muted);font-size:18px;max-width:640px;margin:0 auto 26px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;margin:34px 0}
.feat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
.feat h3{margin:10px 0 6px;font-size:17px}
.feat p{color:var(--muted);font-size:14.5px}
.feat .ic{width:38px;height:38px;border-radius:10px;background:#0e2a22;display:flex;align-items:center;justify-content:center;font-size:19px}
.pricing{display:flex;justify-content:center;margin:20px 0}
.price-card{background:var(--card);border:1px solid var(--teal);border-radius:18px;padding:34px;max-width:380px;width:100%;text-align:center}
.price-card h2{font-size:22px}
.price{font-size:44px;font-weight:800;margin:12px 0}
.price small{font-size:15px;color:var(--muted);font-weight:400}
.price-card ul{list-style:none;margin:18px 0;text-align:left;color:var(--muted);font-size:15px}
.price-card li{padding:6px 0}
.price-card li::before{content:"✓ ";color:var(--teal);font-weight:700}
form.auth{max-width:400px;margin:0 auto}
.field{margin-bottom:16px}
.field label{display:block;font-size:13.5px;color:var(--muted);margin-bottom:6px}
.field input{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:10px;color:var(--txt);padding:12px 14px;font-size:15px}
.field input:focus{outline:none;border-color:var(--teal)}
.alert{background:#2a1414;border:1px solid var(--red);color:#ffb4b2;border-radius:10px;padding:12px 14px;margin-bottom:18px;font-size:14.5px}
.ok{background:#0e2a22;border:1px solid var(--teal);color:#b8f0d9;border-radius:10px;padding:12px 14px;margin-bottom:18px;font-size:14.5px}
.muted{color:var(--muted);font-size:14.5px}
table{width:100%;border-collapse:collapse;font-size:14.5px}
th,td{text-align:left;padding:12px 10px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:.4px}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12.5px;font-weight:700}
.badge.on{background:#0e2a22;color:var(--teal)}
.badge.off{background:#2a1414;color:var(--red)}
.key{font-family:ui-monospace,Menlo,Consolas,monospace;background:var(--card2);padding:6px 10px;border-radius:8px;border:1px solid var(--line)}
.dash-head{display:flex;align-items:center;gap:14px;margin-bottom:24px;flex-wrap:wrap}
.dash-head .spacer{margin-left:auto}
footer{border-top:1px solid var(--line);padding:22px 0;color:var(--muted);font-size:13.5px;text-align:center}
@media(max-width:560px){.dash-head .spacer{margin-left:0}}
</style>
</head>
<body>
<nav><div class="wrap">
  <a class="brand" href="/"><span class="logo"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M4 21h16"/></svg></span>CreatorWatch</a>
  <div class="navlinks">
    {% if user %}
      <a class="btn ghost" href="/dashboard">Dashboard</a>
      <a class="btn ghost" href="/logout">Logout</a>
    {% else %}
      <a class="btn ghost" href="/login">Login</a>
      <a class="btn" href="/signup">Get started</a>
    {% endif %}
  </div>
</div></nav>
<main><div class="wrap">
{% block content %}{% endblock %}
</div></main>
<footer>© 2026 CreatorWatch · Accounts &amp; licenses · <span class="muted">cw.raoshahzaib.site</span></footer>
</body>
</html>
