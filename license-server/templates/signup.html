{% extends "base.html" %}
{% block title %}Sign up — CreatorWatch{% endblock %}
{% block content %}
<div class="card">
<form class="auth" method="post" action="/signup">
  <h2 style="margin-bottom:6px">Create your account</h2>
  <p class="muted" style="margin-bottom:20px">Free forever. You'll need a license key later to unlock the desktop app.</p>
  {% if error %}<div class="alert">{{ error }}</div>{% endif %}
  <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
  <div class="field"><label>Email</label><input type="email" name="email" required placeholder="you@example.com" value="{{ email|default('') }}"></div>
  <div class="field"><label>Password <span class="muted">(min 8 characters)</span></label><input type="password" name="password" required minlength="8" placeholder="••••••••"></div>
  <button class="btn" type="submit" style="width:100%">Sign up</button>
  <p class="muted" style="margin-top:16px;text-align:center">Already have an account? <a href="/login">Log in</a></p>
</form>
</div>
{% endblock %}
